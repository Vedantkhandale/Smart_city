<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nagpur Pulse | Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700;900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/enhance.css">
  <style>
    :root {
      --paper: #F4F0E6; --paper-raise: #FFFFFF; --ink: #0F171C; --ink-soft: #33414E;
      --orange: #FF5500; --orange-deep: #B33B00; --leaf: #00875A; --leaf-tint: #E6F4ED;
      --line: #E2DAA8; --line-subtle: #EAE3D2; --muted: #6B7280; --dark-hud: #0B1015;
      --font-display: 'Zilla Slab', Georgia, serif;
      --font-body: 'Inter', Arial, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font-body);
      background-image: radial-gradient(circle at 10% 0%, rgba(255,85,0,.08), transparent 40rem), radial-gradient(circle at 90% 20%, rgba(0,135,90,.07), transparent 35rem);
      background-attachment: fixed;
    }
    .shell { max-width: 1080px; margin: auto; padding: 28px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand b { font-family: var(--font-display); font-weight: 900; font-size: 19px; }
    .brand small { display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.6px; color: var(--muted); }
    .who { font: 11px var(--font-mono); color: var(--ink-soft); display: flex; align-items: center; gap: 12px; }
    .signout { border: 1px solid var(--line); background: var(--paper-raise); border-radius: 999px; padding: 8px 14px; font: 700 11px var(--font-mono); cursor: pointer; color: var(--ink-soft); }
    .signout:hover { border-color: var(--orange); color: var(--orange-deep); }
    .panel { background: var(--paper-raise); border: 1px solid var(--line-subtle); border-radius: 20px; padding: 36px; text-align: center; }
    .panel h1 { font-family: var(--font-display); font-size: 28px; margin: 6px 0 8px; }
    .panel p { color: var(--muted); max-width: 460px; margin: 0 auto; font-size: 13.5px; line-height: 1.6; }
    .eyebrow { color: var(--orange-deep); font: 700 11px var(--font-mono); letter-spacing: 2px; text-transform: uppercase; }
    .stat-row { display: flex; gap: 16px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
    .stat-row div { border: 1px solid var(--line); border-radius: 14px; padding: 16px 22px; min-width: 140px; }
    .stat-row strong { display: block; font-family: var(--font-display); font-size: 22px; }
    .stat-row span { font: 10px var(--font-mono); color: var(--muted); }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="22" stroke="#FF5500" stroke-width="1.6" stroke-dasharray="2.6 3.4"/>
          <circle cx="24" cy="24" r="16.5" fill="#FFF0E6" stroke="#B33B00" stroke-width="1.2"/>
          <path d="M14 27h5l3-10 6 18 3-9h7" stroke="#0F171C" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span><b>Nagpur Pulse</b><small>COMMAND CENTER</small></span>
      </div>
      <div class="who">
        <span id="whoLabel">Signed in</span>
        <button class="signout" id="signOut">Sign out</button>
      </div>
    </header>

    <section class="panel">
      <div class="eyebrow">Command Center</div>
      <h1>You're in, <span id="whoName">staff</span>.</h1>
      <p>This is the landing spot after a successful login — wire your live ticket queue, SLA board and zone map in
        here. The citizen-facing report flow stays fully separate at <code>index.html</code>.</p>
      <div class="stat-row">
        <div><strong>4</strong><span>DEPARTMENTS</span></div>
        <div><strong>&lt;90m</strong><span>PRIORITY SLA</span></div>
        <div><strong>LIVE</strong><span>SOCKET FEED</span></div>
      </div>
    </section>
  </main>

  <script src="assets/effects.js"></script>
  <script>
    // Simple session guard — bounce back to login if npAuth was never set.
    if (sessionStorage.getItem('npAuth') !== 'true') {
      window.location.href = 'login.html';
    }
    const name = sessionStorage.getItem('npUser') || 'staff';
    document.getElementById('whoLabel').textContent = 'Signed in as ' + name;
    document.getElementById('whoName').textContent = name;
    document.getElementById('signOut').addEventListener('click', () => {
      sessionStorage.removeItem('npAuth');
      sessionStorage.removeItem('npUser');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
