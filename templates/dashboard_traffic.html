<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nagpur Pulse | Traffic Police Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700;900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme-premium.css') }}">
  <style>
    :root {
      --paper: #F4F0E6; --paper-raise: #FFFFFF; --ink: #0F171C; --ink-soft: #33414E;
      --orange: #FF5500; --orange-deep: #B33B00; --leaf: #00875A; --leaf-tint: #E6F4ED;
      --line: #E2DAA8; --line-subtle: #EAE3D2; --muted: #6B7280; --dark-hud: #0B1015; --danger: #DE350B;
      --font-display: 'Zilla Slab', Georgia, serif;
      --font-body: 'Inter', Arial, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font-body);
      background-image: radial-gradient(circle at 10% 0%, rgba(255,85,0,.08), transparent 40rem);
      background-attachment: fixed;
    }
    .shell { max-width: 1400px; margin: auto; padding: 20px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid var(--line-subtle); margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand b { font-family: var(--font-display); font-weight: 900; font-size: 18px; }
    .brand small { display: block; font-family: var(--font-mono); font-size: 8px; letter-spacing: 1.4px; color: var(--orange); }
    .top-right { display: flex; gap: 16px; align-items: center; }
    .nav-back {
      border: 1px solid var(--line); background: var(--paper-raise); padding: 8px 12px; border-radius: 8px;
      font: 10px var(--font-mono); cursor: pointer; color: var(--ink-soft); transition: all 0.2s ease;
      text-transform: uppercase; font-weight: 700; text-decoration: none;
    }
    .nav-back:hover { border-color: var(--orange); color: var(--orange-deep); }
    .signout { border: 1px solid var(--line); background: var(--paper-raise); border-radius: 999px; padding: 8px 14px; font: 700 10px var(--font-mono); cursor: pointer; color: var(--ink-soft); }
    .signout:hover { border-color: var(--danger); color: var(--danger); }
    
    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .control-group { display: flex; gap: 8px; align-items: center; }
    .control-group label { font: 11px var(--font-mono); color: var(--ink-soft); font-weight: 700; }
    .control-group select, .control-group input {
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: 11px var(--font-body); background: var(--paper-raise);
      color: var(--ink);
    }
    
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--paper-raise); border: 1px solid var(--line-subtle); border-radius: 12px; padding: 16px;
      text-align: center; }
    .stat strong { display: block; font-family: var(--font-display); font-size: 20px; color: var(--orange); }
    .stat span { display: block; font: 9px var(--font-mono); color: var(--muted); margin-top: 4px; text-transform: uppercase; }
    
    .tickets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .ticket-card {
      background: var(--paper-raise); border: 1px solid var(--line-subtle); border-radius: 14px; overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      cursor: pointer; animation: floatIn 0.45s ease;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ticket-card:hover { border-color: var(--orange); box-shadow: 0 8px 24px rgba(255,85,0,0.12); transform: translateY(-3px); }
    .ticket-image { width: 100%; height: 160px; background: var(--line-subtle); object-fit: cover; }
    .tracking-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 999px; background: #FFF1E6; border: 1px solid #FFD4B3; color: var(--orange-deep); font: 700 9px var(--font-mono); text-transform: uppercase; letter-spacing: .06em;
    }
    .tracking-note {
      margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #F8F4EC; border: 1px solid var(--line-subtle); font-size: 11px; color: var(--ink-soft); line-height: 1.5;
    }
    .tracking-strip {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
    }
    .tracking-step {
      padding: 4px 6px; border-radius: 999px; font: 700 8px var(--font-mono); color: var(--muted); border: 1px solid var(--line-subtle); background: #fff; opacity: 0.7;
    }
    .tracking-step.done {
      background: #EAF8F0; border-color: #BEE1CE; color: var(--leaf);
    }
    .ticket-content { padding: 14px; }
    .ticket-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
    .ticket-ref { font: 700 11px var(--font-mono); color: var(--orange-deep); }
    .ticket-severity {
      font: 700 9px var(--font-mono); padding: 3px 7px; border-radius: 4px; text-transform: uppercase;
      background: var(--orange-tint); color: var(--orange-deep);
    }
    .ticket-severity.critical { background: #FDECEA; color: var(--danger); }
    .ticket-info { font-size: 12px; }
    .ticket-info p { margin: 4px 0; color: var(--ink-soft); }
    .ticket-zone { color: var(--muted); font-size: 11px; }
    .ticket-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--line-subtle); }
    .risk-score { font: 700 12px var(--font-display); color: var(--orange-deep); }
    .eta { font: 9px var(--font-mono); color: var(--muted); }
    
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .empty p { margin: 0; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="22" stroke="#FF5500" stroke-width="1.6" stroke-dasharray="2.6 3.4"/>
          <circle cx="24" cy="24" r="16.5" fill="#FFF0E6" stroke="#B33B00" stroke-width="1.2"/>
          <path d="M14 27h5l3-10 6 18 3-9h7" stroke="#0F171C" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span><b>Nagpur Pulse</b><small>TRAFFIC POLICE</small></span>
      </div>
      <div class="top-right">
        <a href="/admin" class="nav-back">← Back to Admin</a>
        <div style="display: flex; gap: 12px; align-items: center;">
          <span id="whoLabel" style="font: 11px var(--font-mono); color: var(--ink-soft);"></span>
          <button class="signout" id="signOut">Sign out</button>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="control-group">
        <label for="zoneFilter">Zone:</label>
        <select id="zoneFilter" onchange="loadComplaints()">
          <option value="All">All Zones</option>
          <option value="Dharampeth Zone-1">Dharampeth Zone-1</option>
          <option value="Dhantoli Zone-2">Dhantoli Zone-2</option>
          <option value="Laxmi Nagar Zone-3">Laxmi Nagar Zone-3</option>
          <option value="Nehru Nagar Zone-4">Nehru Nagar Zone-4</option>
        </select>
      </div>
      <div class="control-group">
        <label for="statusFilter">Status:</label>
        <select id="statusFilter" onchange="loadComplaints()">
          <option value="All">All Status</option>
          <option value="Priority Dispatch">Priority Dispatch</option>
          <option value="Queued">Queued</option>
          <option value="Assigned">Assigned</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <strong id="totalCount">0</strong>
        <span>Traffic Reports</span>
      </div>
      <div class="stat">
        <strong id="criticalCount">0</strong>
        <span>Critical</span>
      </div>
      <div class="stat">
        <strong id="pendingCount">0</strong>
        <span>Pending</span>
      </div>
      <div class="stat">
        <strong id="resolvedCount">0</strong>
        <span>Resolved</span>
      </div>
    </div>

    <div id="ticketsContainer" class="tickets-grid"></div>
  </main>

  <div id="statusModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,28,.5);z-index:10;align-items:center;justify-content:center;">
    <div style="background:#fff;max-width:420px;width:min(90vw,420px);padding:22px;border-radius:16px;box-shadow:0 18px 40px rgba(15,23,28,.2);">
      <h3 style="margin:0 0 14px;font-family:'Zilla Slab',serif;">Update ticket status</h3>
      <select id="statusSelect" style="width:100%;padding:12px;border:1px solid #E2DAA8;border-radius:10px;font: 13px Inter, sans-serif;">
        <option value="Queued">Queued</option>
        <option value="Priority Dispatch">Priority Dispatch</option>
        <option value="Assigned">Assigned</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
        <option value="Closed">Closed</option>
        <option value="Rejected">Rejected</option>
      </select>
      <div style="display:flex;gap:10px;margin-top:18px;">
        <button type="button" onclick="closeStatusModal()" style="flex:1;padding:10px;border:0;border-radius:10px;background:#EAE3D2;color:#0F171C;font-weight:700;cursor:pointer;">Cancel</button>
        <button type="button" onclick="saveStatusUpdate()" style="flex:1;padding:10px;border:0;border-radius:10px;background:#FF5500;color:#fff;font-weight:700;cursor:pointer;">Save</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='theme-effects.js') }}"></script>
  <script>
    const expectedDept = 'Traffic';
    if (sessionStorage.getItem('npAuth') !== 'true') {
      sessionStorage.setItem('npAuth', 'true');
      sessionStorage.setItem('npUser', 'Traffic Lead');
      sessionStorage.setItem('npDept', expectedDept);
      sessionStorage.setItem('npRole', 'lead');
    }
    const name = sessionStorage.getItem('npUser') || 'Traffic Lead';
    const dept = sessionStorage.getItem('npDept') || expectedDept;
    if (dept !== expectedDept) {
      sessionStorage.setItem('npDept', expectedDept);
      sessionStorage.setItem('npRole', 'lead');
    }
    document.getElementById('whoLabel').textContent = 'Demo view: ' + name + ' (' + dept + ')';
    document.getElementById('signOut').addEventListener('click', () => {
      fetch('/api/auth/logout', { method: 'POST' });
      sessionStorage.removeItem('npAuth');
      sessionStorage.removeItem('npUser');
      sessionStorage.removeItem('npDept');
      sessionStorage.removeItem('npRole');
      window.location.href = '/dashboard/traffic';
    });

    let selectedTicketId = null;

    function openStatusModal(ticketId) {
      selectedTicketId = ticketId;
      document.getElementById('statusModal').style.display = 'flex';
    }

    function closeStatusModal() {
      selectedTicketId = null;
      document.getElementById('statusModal').style.display = 'none';
    }

    async function saveStatusUpdate() {
      if (!selectedTicketId) return;
      try {
        await fetch(`/api/complaints/${selectedTicketId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: document.getElementById('statusSelect').value })
        });
        closeStatusModal();
        loadComplaints();
      } catch (err) {
        console.error('Status update error:', err);
      }
    }

    async function loadComplaints() {
      try {
        let url = '/api/complaints?limit=250&dept=Traffic';
        const zone = document.getElementById('zoneFilter').value;
        const status = document.getElementById('statusFilter').value;
        if (zone !== 'All') url += '&zone=' + encodeURIComponent(zone);
        if (status !== 'All') url += '&status=' + encodeURIComponent(status);
        const res = await fetch(url);
        const tickets = await res.json();
        renderTickets(tickets);
        updateStats(tickets);
      } catch (err) {
        console.error('Failed to load complaints:', err);
      }
    }

    function renderTickets(tickets) {
      const container = document.getElementById('ticketsContainer');
      if (tickets.length === 0) {
        container.innerHTML = '<div class="empty" style="grid-column: 1/-1;"><p>No traffic reports at this time</p></div>';
        return;
      }

      container.innerHTML = tickets.map(ticket => `
        <div class="ticket-card">
          <img src="${ticket.image_url}" alt="Report" class="ticket-image">
          <div class="ticket-content">
            <div class="ticket-header">
              <span class="ticket-ref">${ticket.reference}</span>
              <span class="ticket-severity ${ticket.severity.toLowerCase()}">${ticket.severity}</span>
            </div>
            <div class="ticket-info">
              <p><strong>Zone:</strong> <span class="ticket-zone">${ticket.zone}</span></p>
              <p><strong>Status:</strong> ${ticket.status}</p>
              <p><strong>Voice Note:</strong> ${ticket.voice ? ticket.voice.substring(0, 40) : 'No note'}...</p>
            </div>
            <div class="tracking-pill">${ticket.status_label || ticket.status}</div>
            <div class="tracking-note">${ticket.tracking_note || 'Live tracking is active.'}</div>
            <div class="tracking-strip">${(ticket.timeline || []).map(step => `<span class="tracking-step ${step.done ? 'done' : ''}">${step.label}</span>`).join('')}</div>
            <div class="ticket-footer">
              <div class="risk-score">Risk: ${ticket.risk_score}/100</div>
              <div class="eta">${ticket.eta || 'ETA pending'}</div>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
              <button type="button" onclick="openStatusModal(${ticket.id})" style="flex:1;min-width:76px;padding:8px 10px;border:1px solid #FF5500;border-radius:8px;background:#fff;color:#FF5500;font:700 10px 'IBM Plex Mono',monospace;cursor:pointer;">Update</button>
              <button type="button" onclick="fetch('/api/complaints/${ticket.id}/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'Resolved'})}).then(() => loadComplaints())" style="flex:1;min-width:76px;padding:8px 10px;border:1px solid #00875A;border-radius:8px;background:#fff;color:#00875A;font:700 10px 'IBM Plex Mono',monospace;cursor:pointer;">Resolve</button>
              <button type="button" onclick="rejectTicket(${ticket.id})" style="flex:1;min-width:76px;padding:8px 10px;border:1px solid #DE350B;border-radius:8px;background:#fff;color:#DE350B;font:700 10px 'IBM Plex Mono',monospace;cursor:pointer;">Reject</button>
              <button type="button" onclick="deleteTicket(${ticket.id})" style="flex:1;min-width:76px;padding:8px 10px;border:1px solid #6B7280;border-radius:8px;background:#fff;color:#6B7280;font:700 10px 'IBM Plex Mono',monospace;cursor:pointer;">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateStats(tickets) {
      const total = tickets.length;
      const critical = tickets.filter(t => t.severity === 'Critical').length;
      const pending = tickets.filter(t => t.status !== 'Resolved').length;
      const resolved = tickets.filter(t => t.status === 'Resolved').length;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('criticalCount').textContent = critical;
      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('resolvedCount').textContent = resolved;
    }

    loadComplaints();
    setInterval(loadComplaints, 5000);
  </script>
</body>
</html>
